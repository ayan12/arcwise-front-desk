<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Front Desk Inbox</title>
<style>
  :root { --bg:#12110E; --card:#1B1915; --line:#2C2922; --fg:#F2EADB; --mute:#A89F8F; --accent:#D4A85A; --user:#2A2720; --lead:#1f8f4e; color-scheme:dark }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
  .wrap { max-width:860px; margin:0 auto; padding-block:32px 80px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }
  h1 { font-size:24px; margin:0 0 4px }
  .sub { color:var(--mute); margin:0 0 24px }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px }
  input, select, button { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:10px 12px }
  input { flex:1; min-width:180px }
  button { background:var(--accent); color:#14130F; border:0; font-weight:600; cursor:pointer }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line) }
  .stats { display:flex; gap:24px; flex-wrap:wrap; color:var(--mute); margin:0 0 16px }
  .stats b { color:var(--fg); font-size:20px; display:block }
  .conv { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden }
  .conv summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap }
  .conv summary::-webkit-details-marker { display:none }
  .when { color:var(--mute); font-size:13px; min-width:120px }
  .first { flex:1 1 200px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .tag { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--lead); color:#fff; font-weight:600 }
  .meta { font-size:12px; color:var(--mute) }
  .msgs { padding:4px 16px 16px; display:flex; flex-direction:column; gap:8px }
  .m { max-width:85%; padding:8px 12px; border-radius:12px; white-space:pre-line; word-wrap:break-word }
  .m.user { align-self:flex-end; background:var(--accent); color:#14130F }
  .m.assistant { align-self:flex-start; background:var(--user) }
  .m small { display:block; margin-top:4px; font-size:12px; opacity:.75 }
  .empty, .err { color:var(--mute); padding:24px 0 }
  .err { color:#E8907E }
</style>
</head>
<body>
<div class="wrap">
  <h1>Front Desk Inbox</h1>
  <p class="sub">Every chat people have with your AI receptionist, newest first. Kept for 90 days.</p>
  <form class="bar" id="login">
    <input id="pw" type="password" placeholder="Inbox password" autocomplete="current-password" aria-label="Inbox password">
    <select id="client" aria-label="Client"></select>
    <button type="submit">Open</button>
    <button type="button" class="ghost" id="refresh" hidden>Refresh</button>
  </form>
  <div id="out"></div>
</div>
<script>
(function () {
  var pw = document.getElementById('pw'), sel = document.getElementById('client'), out = document.getElementById('out');
  var refresh = document.getElementById('refresh');
  try { pw.value = localStorage.getItem('fd-inbox-pw') || ''; } catch (e) {}

  function api(q) {
    return fetch('/api/inbox' + q, { headers: { 'x-inbox-key': pw.value } }).then(function (r) { return r.json().then(function (d) { d._status = r.status; return d; }); });
  }
  function msg(text, cls) { out.textContent = ''; var p = document.createElement('p'); p.className = cls; p.textContent = text; out.appendChild(p); }
  var ERRORS = {
    wrong_password: 'Wrong password.',
    no_password_set: 'No inbox password set yet. Add INBOX_PASSWORD in Vercel settings, then redeploy.',
    no_store: 'Chat storage isn’t connected yet. Add Upstash Redis in Vercel Storage, then redeploy.',
  };
  function ago(t) {
    var s = (Date.now() - t) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    return new Date(t).toLocaleString();
  }

  function render(d) {
    out.textContent = '';
    var list = d.conversations || [];
    var leads = list.filter(function (c) { return c.lead; }).length;
    var today = list.filter(function (c) { return Date.now() - c.updated < 86400000; }).length;
    var st = document.createElement('div'); st.className = 'stats';
    [[list.length, 'conversations'], [today, 'in the last 24 h'], [leads, 'got a WhatsApp button']].forEach(function (x) {
      var s = document.createElement('div'); var b = document.createElement('b'); b.textContent = x[0]; s.appendChild(b); s.appendChild(document.createTextNode(x[1])); st.appendChild(s);
    });
    out.appendChild(st);
    if (!list.length) { var e = document.createElement('p'); e.className = 'empty'; e.textContent = 'No conversations yet. They appear here as soon as someone chats.'; out.appendChild(e); return; }
    list.forEach(function (c) {
      var det = document.createElement('details'); det.className = 'conv';
      var sum = document.createElement('summary');
      var w = document.createElement('span'); w.className = 'when'; w.textContent = ago(c.updated);
      var firstUser = (c.messages || []).filter(function (m) { return m.role === 'user'; })[0];
      var f = document.createElement('span'); f.className = 'first'; f.textContent = firstUser ? firstUser.text : '(no message)';
      sum.appendChild(w); sum.appendChild(f);
      if (c.lead) { var t = document.createElement('span'); t.className = 'tag'; t.textContent = 'WhatsApp'; sum.appendChild(t); }
      var meta = document.createElement('span'); meta.className = 'meta';
      meta.textContent = [c.country, c.page, (c.messages || []).filter(function (m) { return m.role === 'user'; }).length + ' msgs'].filter(Boolean).join(' · ');
      sum.appendChild(meta);
      det.appendChild(sum);
      var box = document.createElement('div'); box.className = 'msgs';
      (c.messages || []).forEach(function (m) {
        var b = document.createElement('div'); b.className = 'm ' + (m.role === 'user' ? 'user' : 'assistant'); b.textContent = m.text;
        if (m.actions && m.actions.length) { var s = document.createElement('small'); s.textContent = 'Button shown: ' + m.actions.join(', '); b.appendChild(s); }
        box.appendChild(b);
      });
      det.appendChild(box);
      out.appendChild(det);
    });
  }

  function load() {
    msg('Loading…', 'empty');
    var go = function () {
      return api('?client=' + encodeURIComponent(sel.value)).then(function (d) {
        if (d.error) return msg(ERRORS[d.error] || d.error, 'err');
        try { localStorage.setItem('fd-inbox-pw', pw.value); localStorage.setItem('fd-inbox-client', sel.value); } catch (e) {}
        refresh.hidden = false;
        render(d);
      });
    };
    if (sel.options.length) return go().catch(function () { msg('Couldn’t load. Check your connection.', 'err'); });
    api('').then(function (d) {
      if (d.error) return msg(ERRORS[d.error] || d.error, 'err');
      var saved = null; try { saved = localStorage.getItem('fd-inbox-client'); } catch (e) {}
      (d.clients || []).forEach(function (c) { var o = document.createElement('option'); o.value = c.id; o.textContent = c.name; sel.appendChild(o); });
      if (saved) sel.value = saved;
      return go();
    }).catch(function () { msg('Couldn’t load. Check your connection.', 'err'); });
  }
  document.getElementById('login').addEventListener('submit', function (e) { e.preventDefault(); load(); });
  refresh.addEventListener('click', load);
  sel.addEventListener('change', function () { if (!refresh.hidden) load(); });
  if (pw.value) load();
})();
</script>
</body>
</html>
