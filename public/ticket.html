<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15130E">
<title>Your place in line · Gentology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --ink:#15130E; --panel:#1D1A14; --line:#332D23; --gold:#C9A15A; --paper:#F3EBDC; --mute:#A39A88; --green:#4CB782; --red:#E06A58; color-scheme:dark }
* { box-sizing:border-box; margin:0 }
[hidden] { display:none !important }
body { min-height:100vh; background:radial-gradient(900px 600px at 50% -10%, #2a2417, var(--ink) 60%); color:var(--paper); font:15px/1.5 Inter, system-ui, -apple-system, sans-serif;
  display:flex; justify-content:center; padding:max(28px, env(safe-area-inset-top,0px)) max(18px, env(safe-area-inset-right,0px)) 40px max(18px, env(safe-area-inset-left,0px)) }
.wrap { width:min(440px, 100%); display:flex; flex-direction:column; gap:18px; text-align:center }
.brand { font-family:'Bodoni Moda', serif; font-size:20px; letter-spacing:.02em }
.brand small { display:block; font-family:Inter, sans-serif; color:var(--mute); font-size:12.5px; letter-spacing:0 }
.ticket { background:var(--panel); border-radius:26px; padding:28px 22px; box-shadow:inset 0 0 0 1px var(--line); position:relative; overflow:hidden }
.ticket:before, .ticket:after { content:""; position:absolute; top:58%; width:26px; height:26px; border-radius:50%; background:var(--ink); }
.ticket:before { left:-13px } .ticket:after { right:-13px }
.lab { color:var(--mute); font-size:13px }
.num { font-family:'Bodoni Moda', serif; font-size:112px; line-height:1; color:var(--gold); margin:6px 0 4px }
.name { font-size:17px; font-weight:600 }
.svc { color:var(--mute); font-size:14px }
.sep { border-top:1.5px dashed var(--line); margin:22px -22px 18px }
.state { font-family:'Bodoni Moda', serif; font-size:30px; line-height:1.15 }
.state i { color:var(--gold) }
.sub { color:var(--mute); margin-top:6px }
.prog { display:flex; gap:6px; justify-content:center; margin-top:16px; flex-wrap:wrap }
.prog span { width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:12px; color:var(--mute) }
.prog span.me { background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:700 }
.prog span.chair { border-color:var(--green); color:var(--green) }
.info { background:var(--panel); border-radius:18px; padding:16px 18px; box-shadow:inset 0 0 0 1px var(--line); text-align:left; display:flex; flex-direction:column; gap:10px }
.info b { font-weight:600 } .info p { color:var(--mute); font-size:14px }
.row { display:flex; gap:10px }
.btn { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; text-decoration:none; padding:13px; border-radius:14px; font-weight:700; font-size:14.5px; border:0; cursor:pointer; font-family:inherit }
.btn.gold { background:var(--gold); color:var(--ink) }
.btn.line { background:transparent; color:var(--paper); box-shadow:inset 0 0 0 1px var(--line) }
.btn.red { background:transparent; color:var(--red); box-shadow:inset 0 0 0 1px #4a2a24 }
.foot { color:#6d6556; font-size:12px }
.live { display:inline-flex; gap:6px; align-items:center } .live:before { content:""; width:7px; height:7px; border-radius:50%; background:var(--green); animation:p 2s infinite }
@keyframes p { 50% { opacity:.3 } }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px }
@media (prefers-reduced-motion:reduce) { * { animation:none !important } }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">GENTOLOGY<small>Barbershop · Waiting list</small></div>
  <section class="ticket" aria-live="polite">
    <p class="lab" id="where">Loading your ticket…</p>
    <div class="num" id="num">–</div>
    <p class="name" id="name"></p><p class="svc" id="svc"></p>
    <div class="sep"></div>
    <p class="state" id="state"></p>
    <p class="sub" id="sub"></p>
    <div class="prog" id="prog" aria-hidden="true"></div>
  </section>
  <section class="info" id="info" hidden>
    <div><b id="bname"></b><p id="addr"></p></div>
    <div class="row"><a class="btn gold" id="maps" target="_blank" rel="noopener">Directions</a><a class="btn line" id="wa" target="_blank" rel="noopener">WhatsApp branch</a></div>
  </section>
  <div class="row" id="cancelRow" hidden><button class="btn red" id="cancel" type="button">Cancel my spot</button></div>
  <p class="foot"><span class="live">Updates live</span> · Please arrive when it’s almost your turn.</p>
</main>
<script src="/ticket.js" type="module"></script>
</body>
</html>
