<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15130E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gentology Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --ink:#15130E; --panel:#1D1A14; --panel2:#25211A; --line:#332D23; --gold:#C9A15A; --gold-soft:#3A3020; --paper:#F3EBDC; --mute:#A39A88; --dim:#7A7263;
  --green:#4CB782; --green-soft:#183326; --amber:#E2A84B; --red:#E06A58; --red-soft:#3A1E1A; --wa:#25D366; color-scheme:dark }
* { box-sizing:border-box; margin:0 }
[hidden] { display:none !important }
html, body { min-height:100% }
body { background:var(--ink); color:var(--paper); font:15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased }
button, input { font:inherit; color:inherit }
button { cursor:pointer; border:0; background:none }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:10px }
.serif { font-family:'Bodoni Moda', Georgia, serif }

/* pin */
.pin { min-height:100vh; display:grid; place-items:center; padding:24px }
.pin .box { width:min(360px, 100%); text-align:center; display:flex; flex-direction:column; gap:16px; align-items:center }
.pin h1 { font-family:'Bodoni Moda', serif; font-weight:500; font-size:34px }
.pin p { color:var(--mute) }
.dots { display:flex; gap:14px; margin:6px 0 4px }
.dots i { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--gold) } .dots i.on { background:var(--gold) }
.keys { display:grid; grid-template-columns:repeat(3, 76px); gap:14px }
.keys button { height:76px; border-radius:50%; background:var(--panel); font-size:26px; font-weight:500; box-shadow:inset 0 0 0 1px var(--line) }
.keys button:active { background:var(--gold-soft) }
.err { color:var(--red); min-height:20px; font-size:14px }
.demo { font-size:13px; color:var(--dim); border:1px dashed var(--line); padding:8px 12px; border-radius:10px }

/* app */
.top { display:flex; align-items:center; gap:16px; padding:14px max(20px, env(safe-area-inset-right,0px)) 14px max(20px, env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; background:color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter:blur(8px); z-index:5 }
.brand { display:flex; align-items:center; gap:10px }
.brand .g { width:38px; height:38px; border-radius:50%; border:1px solid var(--gold); color:var(--gold); display:grid; place-items:center; font-family:'Bodoni Moda', serif; font-size:19px }
.brand b { font-family:'Bodoni Moda', serif; font-size:19px; font-weight:600; display:block; line-height:1 }
.brand small { color:var(--mute); font-size:12px }
.tabs { display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:14px; box-shadow:inset 0 0 0 1px var(--line); flex-wrap:wrap }
.tabs button { padding:9px 14px; border-radius:10px; color:var(--mute); font-weight:600; font-size:14px }
.tabs button.on { background:var(--gold); color:var(--ink) }
.grow { flex:1 }
.clock { font-family:'Bodoni Moda', serif; font-size:24px; color:var(--paper) }
.ghost { color:var(--mute); padding:9px 12px; border-radius:10px; font-size:14px; font-weight:500 }
.ghost:hover { background:var(--panel) }

.main { padding:20px max(20px, env(safe-area-inset-right,0px)) 40px max(20px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:18px }
.strip { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:10px }
.stat { background:var(--panel); border-radius:16px; padding:14px 16px; box-shadow:inset 0 0 0 1px var(--line) }
.stat b { font-family:'Bodoni Moda', serif; font-size:32px; font-weight:500; display:block; line-height:1.05 }
.stat span { color:var(--mute); font-size:13px }
.stat.barbers { display:flex; flex-direction:column; justify-content:space-between }
.step { display:flex; align-items:center; gap:10px }
.step button { width:38px; height:38px; border-radius:12px; background:var(--panel2); font-size:22px; box-shadow:inset 0 0 0 1px var(--line) }
.step b { min-width:30px; text-align:center }

.cols { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.8fr); gap:16px; align-items:start }
.col { background:var(--panel); border-radius:20px; box-shadow:inset 0 0 0 1px var(--line); padding:14px; display:flex; flex-direction:column; gap:10px; min-height:280px }
.col h2 { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; padding:2px 4px 4px }
.col h2 .n { background:var(--panel2); color:var(--mute); border-radius:999px; padding:1px 9px; font-size:12.5px }
.col h2 .grow + * { margin-left:auto }
.add { background:var(--gold); color:var(--ink); padding:10px 14px; border-radius:12px; font-weight:700; font-size:14px }
.card { background:var(--panel2); border-radius:16px; padding:12px; display:grid; grid-template-columns:62px minmax(0,1fr) auto; gap:12px; align-items:center; box-shadow:inset 0 0 0 1px var(--line); animation:in .25s ease-out }
@keyframes in { from { transform:translateY(6px); opacity:0 } }
.card.first { box-shadow:inset 0 0 0 1.5px var(--gold) }
.no { font-family:'Bodoni Moda', serif; font-size:34px; font-weight:600; text-align:center; line-height:1; color:var(--gold) }
.card .who b { display:block; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.card .who span { color:var(--mute); font-size:13px; display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.src { font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:#173426; color:var(--wa) }
.src.walk { background:var(--panel); color:var(--mute) }
.acts { display:flex; gap:6px }
.btn { padding:11px 14px; border-radius:12px; font-weight:700; font-size:14px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--line); white-space:nowrap }
.btn.go { background:var(--gold); color:var(--ink); box-shadow:none }
.btn.done { background:var(--green); color:#0c1a12; box-shadow:none }
.btn.warn { color:var(--red) }
.timer { font-variant-numeric:tabular-nums; color:var(--paper); font-weight:600 }
.over { color:var(--amber) }
.empty { color:var(--dim); text-align:center; padding:30px 10px; font-size:14px }
.donelist { display:flex; flex-direction:column; gap:2px }
.donelist div { display:grid; grid-template-columns:40px 1fr auto; gap:8px; padding:8px 6px; border-bottom:1px solid var(--line); font-size:14px; align-items:center }
.donelist div:last-child { border:0 }
.donelist .k { font-family:'Bodoni Moda', serif; color:var(--mute); font-size:18px }
.donelist .s { font-size:12px; color:var(--dim) }
.donelist .s.ns { color:var(--red) }

/* owner */
.branches { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px }
.bcard { background:var(--panel); border-radius:20px; padding:18px; box-shadow:inset 0 0 0 1px var(--line); display:flex; flex-direction:column; gap:14px; cursor:pointer; text-align:left }
.bcard:hover { box-shadow:inset 0 0 0 1px var(--gold) }
.bcard h3 { font-family:'Bodoni Moda', serif; font-size:24px; font-weight:500 }
.bcard .row { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px }
.bcard .row b { font-family:'Bodoni Moda', serif; font-size:28px; font-weight:500; display:block } .bcard .row span { color:var(--mute); font-size:12.5px }
.serving { display:flex; gap:6px; flex-wrap:wrap; align-items:center; color:var(--mute); font-size:13px }
.serving i { font-style:normal; background:var(--gold-soft); color:var(--gold); border-radius:8px; padding:2px 8px; font-weight:700 }
.bar { height:6px; border-radius:6px; background:var(--panel2); overflow:hidden; display:flex }
.bar span { height:100% }

/* modal */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:grid; place-items:center; z-index:20; padding:20px; animation:fade .15s }
@keyframes fade { from { opacity:0 } }
.modal { background:var(--panel); border-radius:22px; padding:22px; width:min(520px, 100%); display:flex; flex-direction:column; gap:16px; box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.5) }
.modal h3 { font-family:'Bodoni Moda', serif; font-size:26px; font-weight:500 }
.modal input { background:var(--panel2); border:0; box-shadow:inset 0 0 0 1px var(--line); border-radius:14px; padding:14px 16px; font-size:18px; width:100%; outline:none }
.modal input:focus { box-shadow:inset 0 0 0 1.5px var(--gold) }
.chips { display:flex; flex-wrap:wrap; gap:8px }
.chip { padding:10px 14px; border-radius:12px; background:var(--panel2); box-shadow:inset 0 0 0 1px var(--line); font-weight:600; font-size:14px }
.chip.on { background:var(--gold); color:var(--ink); box-shadow:none }
.chip small { display:block; font-weight:500; font-size:12px; opacity:.75 }
.modal .row { display:flex; gap:10px; justify-content:flex-end }
.toast { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--paper); color:var(--ink); padding:11px 18px; border-radius:12px; font-weight:600; z-index:30; animation:fade .2s }

@media (max-width:1100px) { .cols { grid-template-columns:minmax(0,1fr) minmax(0,1fr) } .cols .col:last-child { grid-column:1 / -1 } .strip { grid-template-columns:repeat(3, minmax(0,1fr)) } .branches { grid-template-columns:1fr } }
@media (max-width:700px) { .cols { grid-template-columns:1fr } .strip { grid-template-columns:repeat(2, minmax(0,1fr)) } .clock { display:none } .card { grid-template-columns:48px minmax(0,1fr); } .card .acts { grid-column:1 / -1 } .card .acts .btn { flex:1 } .no { font-size:28px } }
@media (prefers-reduced-motion:reduce) { * { animation:none !important } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/gentology/branch.js"></script>
</body>
</html>
