<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Arcwise Workstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#F0EDE6; --hover:#EAE6DE; --line:#E2DED5; --line2:#D3CEC3;
  --fg:#16181D; --mute:#5E636D; --dim:#8A8F98; --accent:#E8571A; --accent-ink:#FFFFFF; --accent-soft:#FCE6DA;
  --up:#1F8F5F; --up-soft:#DDF2E7; --slow:#B07A12; --slow-soft:#F7ECCF; --down:#C93C2B; --down-soft:#F8DEDA;
  --blue:#2F6FD6; --blue-soft:#DEE8FA; --violet:#7556C9; --violet-soft:#E9E3F8;
  --shadow:0 1px 2px rgba(22,24,29,.06), 0 8px 24px rgba(22,24,29,.06);
  --side:#101217; --side-fg:#E9E6DF; --side-mute:#8E929B; --side-hover:#1B1E25; --side-line:#23262E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) {
  --bg:#0E1014; --panel:#15181E; --panel2:#1B1F26; --hover:#20242C; --line:#252932; --line2:#323743;
  --fg:#F1EEE8; --mute:#A2A6AF; --dim:#727782; --accent:#FF6A2B; --accent-ink:#101217; --accent-soft:#3A2116;
  --up:#41B883; --up-soft:#15291F; --slow:#E0A93B; --slow-soft:#2E2512; --down:#EF6A58; --down-soft:#341A17;
  --blue:#6E9EF0; --blue-soft:#18243A; --violet:#A58BEB; --violet-soft:#241D38;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
  --side:#0A0B0E; --side-fg:#E9E6DF; --side-mute:#868A93; --side-hover:#15171C; --side-line:#1C1F25;
  color-scheme:dark;
} }
:root[data-theme="dark"] {
  --bg:#0E1014; --panel:#15181E; --panel2:#1B1F26; --hover:#20242C; --line:#252932; --line2:#323743;
  --fg:#F1EEE8; --mute:#A2A6AF; --dim:#727782; --accent:#FF6A2B; --accent-ink:#101217; --accent-soft:#3A2116;
  --up:#41B883; --up-soft:#15291F; --slow:#E0A93B; --slow-soft:#2E2512; --down:#EF6A58; --down-soft:#341A17;
  --blue:#6E9EF0; --blue-soft:#18243A; --violet:#A58BEB; --violet-soft:#241D38;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
  --side:#0A0B0E; --side-fg:#E9E6DF; --side-mute:#868A93; --side-hover:#15171C; --side-line:#1C1F25;
  color-scheme:dark;
}
* { box-sizing:border-box }
[hidden] { display:none !important }
html, body { height:100% }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased }
button, input, select, textarea { font:inherit; color:inherit }
a { color:inherit }
h1, h2, h3, .num { font-family:'Space Grotesk', Inter, system-ui, sans-serif; letter-spacing:-.01em }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }

/* ---------- shell ---------- */
.app { display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh }
.side { background:var(--side); color:var(--side-fg); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  padding:18px 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px)) }
.brand { display:flex; align-items:center; gap:10px; padding:4px 8px 18px }
.brand b { font-family:'Space Grotesk', sans-serif; font-size:16px; display:block; line-height:1.1 }
.brand small { color:var(--side-mute); font-size:12px }
.mark { width:32px; height:32px; border-radius:9px; background:#FF6A2B; display:grid; place-items:center; flex:none }
.nav { display:flex; flex-direction:column; gap:2px }
.nav a { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; text-decoration:none; color:var(--side-mute); font-weight:500 }
.nav a:hover { background:var(--side-hover); color:var(--side-fg) }
.nav a.on { background:var(--side-hover); color:var(--side-fg) }
.nav a.on svg { color:#FF6A2B }
.nav .count { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--side-mute); background:var(--side-line); border-radius:999px; padding:1px 8px }
.nav .count.alert { background:#C93C2B; color:#fff }
.nav .count.good { background:#1F8F5F; color:#fff }
.side .grow { flex:1 }
.sidefoot { border-top:1px solid var(--side-line); padding-top:12px; display:flex; flex-direction:column; gap:4px }
.sidefoot button { display:flex; align-items:center; gap:11px; padding:8px 10px; background:none; border:0; border-radius:9px; color:var(--side-mute); cursor:pointer; text-align:left }
.sidefoot button:hover { background:var(--side-hover); color:var(--side-fg) }
.synced { color:var(--side-mute); font-size:12px; padding:4px 10px 0 }
.pulse { display:inline-block; width:7px; height:7px; border-radius:50%; background:#41B883; margin-right:6px; vertical-align:1px }

.main { min-width:0; display:flex; flex-direction:column }
.top { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px;
  padding-block:14px; padding-left:28px; padding-right:max(28px, env(safe-area-inset-right,0px)) }
.top h1 { font-size:21px; margin:0; font-weight:600 }
.top .sub { color:var(--mute); font-size:13px }
.top .spacer { flex:1 }
.search { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:0 10px; width:260px; color:var(--dim) }
.search input { border:0; background:none; outline:none; padding:8px 0; width:100%; color:var(--fg) }
.iconbtn.menu-btn, .menu-btn { display:none }
.content { padding-block:24px 64px; padding-left:28px; padding-right:max(28px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:20px }

/* ---------- controls ---------- */
.btn { display:inline-flex; align-items:center; gap:7px; border-radius:9px; padding:8px 13px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-weight:600; font-size:13.5px; white-space:nowrap; text-decoration:none }
.btn:hover { background:var(--hover) }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.btn.primary:hover { filter:brightness(1.05) }
.btn.danger { color:var(--down); border-color:color-mix(in srgb, var(--down) 40%, var(--line)) }
.btn.ghost { background:none; border-color:transparent }
.btn.sm { padding:5px 9px; font-size:12.5px; border-radius:8px }
.btn:disabled { opacity:.5; cursor:default }
.iconbtn { width:34px; height:34px; display:grid; place-items:center; border-radius:9px; border:1px solid var(--line); background:var(--panel); cursor:pointer; flex:none }
.iconbtn:hover { background:var(--hover) }
.seg { display:inline-flex; background:var(--panel2); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap }
.seg button { border:0; background:none; padding:6px 12px; border-radius:8px; cursor:pointer; color:var(--mute); font-weight:600; font-size:13px; display:inline-flex; gap:6px; align-items:center }
.seg button.on { background:var(--panel); color:var(--fg); box-shadow:var(--shadow) }
label.f { display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--mute); font-weight:500 }
.f input, .f select, .f textarea { background:var(--panel); border:1px solid var(--line2); border-radius:9px; padding:9px 11px; color:var(--fg); font-size:14px; width:100% }
.f textarea { min-height:90px; resize:vertical; line-height:1.45 }
.f input:focus, .f select:focus, .f textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft) }
.check { display:flex; gap:9px; align-items:flex-start; font-size:13.5px; color:var(--fg) }
.check input { margin-top:3px; accent-color:var(--accent) }

/* ---------- surfaces ---------- */
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); min-width:0 }
.card > header { display:flex; align-items:center; gap:10px; padding:16px 18px 0; flex-wrap:wrap }
.card > header h2 { font-size:15px; margin:0; font-weight:600 }
.card > header .hint { color:var(--dim); font-size:12.5px }
.card > header .r { margin-left:auto; display:flex; gap:8px; align-items:center }
.card .body { padding:14px 18px 18px }
.grid2 { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px }
.grid3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:20px }

.kpis { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:12px }
.kpi { padding:15px 16px; display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden }
.kpi .label { color:var(--mute); font-size:12.5px; font-weight:500 }
.kpi .num { font-size:25px; font-weight:600; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.kpi .meta { font-size:12px; color:var(--dim); display:flex; gap:6px; align-items:center; flex-wrap:wrap }
.delta { font-weight:600; font-size:12px }
.delta.pos { color:var(--up) } .delta.neg { color:var(--down) } .delta.flat { color:var(--dim) }
.kpi svg.spark { position:absolute; right:10px; bottom:10px; width:70px; height:26px; opacity:.9 }

.pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; background:var(--panel2); color:var(--mute) }
.pill .d { width:7px; height:7px; border-radius:50%; background:currentColor }
.pill.up { background:var(--up-soft); color:var(--up) } .pill.slow { background:var(--slow-soft); color:var(--slow) } .pill.down { background:var(--down-soft); color:var(--down) }
.pill.blue { background:var(--blue-soft); color:var(--blue) } .pill.violet { background:var(--violet-soft); color:var(--violet) } .pill.accent { background:var(--accent-soft); color:var(--accent) }
.st-Lead { background:var(--panel2); color:var(--mute) } .st-Concept { background:var(--violet-soft); color:var(--violet) } .st-Pitched { background:var(--blue-soft); color:var(--blue) }
.st-Won { background:var(--up-soft); color:var(--up) } .st-Building { background:var(--slow-soft); color:var(--slow) } .st-Live { background:var(--accent-soft); color:var(--accent) } .st-Lost { background:var(--down-soft); color:var(--down) }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none }
.dot.up { background:var(--up) } .dot.slow { background:var(--slow) } .dot.down { background:var(--down) } .dot.none { background:var(--line2) }

/* attention */
.att { list-style:none; margin:0; padding:0; display:flex; flex-direction:column }
.att li { display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--line) }
.att li:first-child { border-top:0; padding-top:2px }
.ic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none }
.ic.high { background:var(--down-soft); color:var(--down) } .ic.mid { background:var(--slow-soft); color:var(--slow) } .ic.low { background:var(--blue-soft); color:var(--blue) } .ic.good { background:var(--up-soft); color:var(--up) }
.att b { font-weight:600; display:block }
.att span.s { color:var(--mute); font-size:13px }
.allclear { display:flex; gap:12px; align-items:center; color:var(--mute); padding:8px 0 }

/* feed */
.feed { list-style:none; margin:0; padding:0; display:flex; flex-direction:column }
.feed li { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; padding:9px 0; align-items:start; border-top:1px solid var(--line) }
.feed li:first-child { border-top:0 }
.feed .t { color:var(--dim); font-size:12px; white-space:nowrap }
.feed .ty { width:22px; height:22px; border-radius:7px; display:grid; place-items:center; background:var(--panel2); color:var(--mute) }
.feed .ty.alert { background:var(--down-soft); color:var(--down) } .feed .ty.stage { background:var(--up-soft); color:var(--up) } .feed .ty.note { background:var(--blue-soft); color:var(--blue) }
.feed .who { color:var(--mute); font-size:12.5px }

/* pipeline strip */
.strip { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:8px }
.strip button { text-align:left; background:var(--panel2); border:1px solid transparent; border-radius:11px; padding:11px 12px; cursor:pointer; display:flex; flex-direction:column; gap:2px; min-width:0 }
.strip button:hover { border-color:var(--line2) }
.strip .pill { align-self:flex-start }
.strip .n { font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:600 }
.strip .v { color:var(--mute); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.bar { height:4px; border-radius:4px; margin-top:6px }

/* board */
.board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(220px, 1fr); gap:14px; overflow-x:auto; padding-bottom:8px; align-items:start }
.col { background:var(--panel2); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:160px; border:1px dashed transparent }
.col.over { border-color:var(--accent); background:var(--accent-soft) }
.col h3 { margin:2px 4px 4px; font-size:13px; display:flex; align-items:center; gap:8px; font-family:Inter, sans-serif; font-weight:600 }
.col h3 small { color:var(--dim); font-weight:500; margin-left:auto; white-space:nowrap }
.deal { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:11px 12px; cursor:pointer; display:flex; flex-direction:column; gap:6px; box-shadow:0 1px 1px rgba(0,0,0,.03) }
.deal:hover { border-color:var(--line2); box-shadow:var(--shadow) }
.deal.dragging { opacity:.4 }
.deal b { font-size:14px }
.deal .sub { color:var(--mute); font-size:12.5px }
.deal .row { display:flex; gap:8px; align-items:center; justify-content:space-between; font-size:12.5px }
.deal .val { font-weight:600 }
.emptycol { color:var(--dim); font-size:12.5px; padding:10px 6px; text-align:center }

/* tables */
.tablewrap { overflow-x:auto }
table.t { width:100%; border-collapse:collapse; font-size:13.5px }
.t th { text-align:left; font-weight:600; color:var(--mute); font-size:12px; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--panel) }
.t td { padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle }
.t tr:last-child td { border-bottom:0 }
.t tbody tr { cursor:pointer }
.t tbody tr:hover td { background:var(--hover) }
.t .host b { display:block; font-weight:600 }
.t .host span { color:var(--mute); font-size:12.5px }
.t .r { text-align:right }
.nowrap { white-space:nowrap }
.miniscore { font-family:'Space Grotesk', sans-serif; font-weight:600 }
.g { color:var(--up) } .m { color:var(--slow) } .p { color:var(--down) } .muted { color:var(--dim) }
svg.ups { width:90px; height:20px; display:block }

/* chats */
.inbox { display:grid; grid-template-columns:340px minmax(0,1fr); min-height:560px; overflow:hidden }
.inbox .list { border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0 }
.inbox .filters { display:flex; gap:8px; padding:12px; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center }
.inbox .items { overflow-y:auto; max-height:640px }
.conv { display:flex; flex-direction:column; gap:3px; padding:12px 14px; border:0; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:3px solid transparent; text-align:left; width:100% }
.conv:hover { background:var(--hover) }
.conv.on { background:var(--hover); border-left-color:var(--accent) }
.conv .l1 { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim) }
.conv .l1 .grow { flex:1 }
.conv .first { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.thread { display:flex; flex-direction:column; min-width:0 }
.thread header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap }
.thread header b { font-size:15px }
.msgs { padding:18px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; max-height:620px }
.msg { max-width:78%; padding:10px 13px; border-radius:14px; white-space:pre-line; word-wrap:break-word; font-size:14px }
.msg.user { align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:5px }
.msg.assistant { align-self:flex-start; background:var(--panel2); border-bottom-left-radius:5px }
.msg small { display:block; margin-top:6px; font-size:11.5px; opacity:.8 }
.placeholder { display:grid; place-items:center; color:var(--dim); padding:40px; text-align:center; min-height:300px }
.placeholder p { max-width:34ch }

/* drawer */
.scrim { position:fixed; inset:0; background:rgba(10,11,14,.42); z-index:40; animation:fade .15s }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px, 100vw); background:var(--bg); z-index:41; display:flex; flex-direction:column;
  box-shadow:-20px 0 60px rgba(0,0,0,.25); animation:slide .2s ease-out; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
@keyframes slide { from { transform:translateX(30px); opacity:.4 } }
@keyframes fade { from { opacity:0 } }
.drawer > header { display:flex; align-items:flex-start; gap:12px; padding:20px 22px 14px; border-bottom:1px solid var(--line); background:var(--panel) }
.drawer > header h2 { margin:0; font-size:20px; overflow-wrap:anywhere }
.drawer > header .sub { color:var(--mute); font-size:13px }
.drawer .tabs { display:flex; gap:4px; padding:0 22px; border-bottom:1px solid var(--line); background:var(--panel) }
.drawer .tabs button { background:none; border:0; padding:11px 10px; cursor:pointer; color:var(--mute); font-weight:600; border-bottom:2px solid transparent; margin-bottom:-1px }
.drawer .tabs button.on { color:var(--fg); border-bottom-color:var(--accent) }
.drawer .dbody { flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:16px }
.drawer footer { border-top:1px solid var(--line); padding:12px 22px; display:flex; gap:8px; align-items:center; background:var(--panel); flex-wrap:wrap }
.drawer footer .grow { flex:1 }
.form2 { display:grid; grid-template-columns:1fr 1fr; gap:12px }
.form2 .wide { grid-column:1 / -1 }
.quick { display:flex; gap:8px; flex-wrap:wrap }
.sitecard { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--panel); display:flex; flex-direction:column; gap:6px }
.sitecard .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
.sitecard .row .grow { flex:1 }
.stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 12px; min-width:0 }
.stat .num { font-size:19px; font-weight:600; display:block; white-space:nowrap }
.stat span { color:var(--mute); font-size:12px }
.checks { list-style:none; margin:0; padding:0; display:flex; flex-direction:column }
.checks li { display:grid; grid-template-columns:48px minmax(0,1fr); gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px }
.checks li:first-child { border-top:0 }
.checks em { display:block; color:var(--mute); font-style:normal; font-size:12.5px; overflow-wrap:anywhere }
.ok { color:var(--up); font-weight:700 } .no { color:var(--down); font-weight:700 }
.scores { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px }
.ring { display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--panel2); border-radius:12px; padding:12px 6px }
.ring span { font-size:12px; color:var(--mute); text-align:center }
.note { color:var(--mute); font-size:13px; margin:0 }
.sect { font-size:12px; font-weight:600; color:var(--mute); margin:4px 0 -6px }
.confirm { display:flex; gap:8px; align-items:center; background:var(--down-soft); color:var(--down); padding:8px 10px; border-radius:10px; font-size:13px; font-weight:600; flex-wrap:wrap }
pre.code { white-space:pre-wrap; word-break:break-all; background:var(--panel2); padding:10px 12px; border-radius:9px; font-size:12.5px; margin:8px 0 0 }

/* login + toast */
.login { min-height:100vh; display:grid; place-items:center; padding:20px }
.login .card { width:min(400px, 100%); padding:28px; display:flex; flex-direction:column; gap:14px }
.login h1 { margin:6px 0 0; font-size:24px }
.err { color:var(--down); font-size:13px; margin:0 }
.toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; z-index:60; box-shadow:var(--shadow); animation:fade .2s; max-width:calc(100vw - 32px) }
.loading { color:var(--mute); padding:40px 28px }
.chart { width:100%; height:180px; display:block; margin-top:8px }
.legend { display:flex; gap:14px; font-size:12px; color:var(--mute); flex-wrap:wrap }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px }

/* responsive */
@media (max-width:1280px) { .kpis { grid-template-columns:repeat(3, minmax(0,1fr)) } }
@media (max-width:1080px) { .grid2, .grid3 { grid-template-columns:minmax(0,1fr) } .strip { grid-template-columns:repeat(3, minmax(0,1fr)) } }
@media (max-width:860px) {
  .app { grid-template-columns:minmax(0,1fr) }
  .side { position:fixed; z-index:50; left:0; top:0; width:260px; transform:translateX(-100%); transition:transform .2s }
  .side.open { transform:none; box-shadow:20px 0 60px rgba(0,0,0,.4) }
  .iconbtn.menu-btn, .menu-btn { display:grid }
  .top { padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); flex-wrap:wrap }
  .search { order:5; width:100% }
  .content { padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }
  .hide-sm { display:none !important }
  .inbox { grid-template-columns:minmax(0,1fr) }
  .inbox .list { border-right:0 }
  .inbox.reading .list { display:none }
  .inbox:not(.reading) .thread { display:none }
}
@media (max-width:560px) { .kpis { grid-template-columns:repeat(2, minmax(0,1fr)) !important } .strip { grid-template-columns:repeat(2, minmax(0,1fr)) } .stats, .scores { grid-template-columns:repeat(2, minmax(0,1fr)) } .form2 { grid-template-columns:1fr } .kpi svg.spark { display:none } .kpi .num { font-size:21px } }
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important } }
</style>
</head>

<div id="root"></div>
