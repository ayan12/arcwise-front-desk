# Cloudflare Workers config (free plan). Settings and secrets are added in the Cloudflare dashboard.
name = "arcwise-front-desk"
main = "worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
# Only the API wakes the Worker; pages and files are served free from the edge (headers in public/_headers).
run_worker_first = ["/api/*"]

[triggers]
crons = ["17 1 * * *"]

[observability]
enabled = true

[vars]
# The shared code checks this name to switch off localhost testing in production.
VERCEL_ENV = "production"
